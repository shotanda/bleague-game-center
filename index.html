<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.LEAGUE GAME CENTER</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #0b1024;
  --navy: #111a38;
  --blue: #55c9f5;
  --purple: #a78bfa;
  --cyan: #67e8f9;
  --text: #f3f6ff;
  --muted: #a4aecb;
  --glass: rgba(255,255,255,.075);
  --glass-border: rgba(255,255,255,.14);
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, rgba(84,115,255,.25), transparent 35%),
    radial-gradient(circle at 90% 25%, rgba(153,93,255,.22), transparent 35%),
    radial-gradient(circle at 50% 90%, rgba(41,190,220,.12), transparent 40%),
    var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  min-height: 82px;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(16,24,52,.72);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--glass-border);
  position: relative;
  z-index: 5;
}

.logo {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  color: var(--cyan);
}

.season {
  color: var(--cyan);
  font-weight: bold;
  background: rgba(103,232,249,.10);
  border: 1px solid rgba(103,232,249,.3);
  padding: 8px 14px;
  border-radius: 30px;
  font-size: 13px;
}

nav {
  display: flex;
  gap: 10px;
  padding: 16px 6%;
  background: rgba(15,23,48,.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--glass-border);
  overflow-x: auto;
  position: relative;
  z-index: 4;
}

nav button, .league button {
  background: rgba(255,255,255,.07);
  color: var(--muted);
  border: 1px solid var(--glass-border);
  padding: 11px 18px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: 900;
  white-space: nowrap;
  transition: .25s;
}

nav button:hover, .league button:hover {
  color: white;
  background: rgba(255,255,255,.13);
}

nav button.active, .league button.active {
  background: linear-gradient(135deg, #438cf5, #9275f5);
  color: white;
  border-color: transparent;
  box-shadow: 0 5px 20px rgba(91,125,255,.35);
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 38px 6%;
  min-height: 65vh;
}

h1 {
  color: white;
  font-size: 30px;
  font-weight: 1000;
  margin-bottom: 8px;
  letter-spacing: .5px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 28px;
}

.section-title {
  color: white;
  font-size: 19px;
  font-weight: 1000;
  margin: 32px 0 17px;
  padding-left: 13px;
  border-left: 4px solid var(--cyan);
  letter-spacing: .5px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 16px;
}

.card {
  position: relative;
  background: var(--glass);
  color: var(--text);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 12px 35px rgba(0,0,0,.18);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: .25s;
  min-width: 0;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 15%;
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
}

.card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,.11);
  border-color: rgba(103,232,249,.4);
  box-shadow: 0 16px 40px rgba(0,0,0,.28);
}

.tag {
  display: inline-block;
  color: var(--cyan);
  background: rgba(103,232,249,.10);
  border: 1px solid rgba(103,232,249,.25);
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
}

.match {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 22px;
  gap: 8px;
}

.team {
  text-align: center;
  flex: 1;
  min-width: 0;
  color: white;
  font-weight: 900;
  overflow-wrap: anywhere;
}

.score {
  color: var(--cyan);
  font-size: 25px;
  font-weight: 1000;
  white-space: nowrap;
  text-shadow: 0 0 15px rgba(103,232,249,.35);
}

.status {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  line-height: 1.7;
}

.card a {
  display: block;
  margin-top: 14px;
  padding: 10px;
  background: rgba(84,156,255,.13);
  border: 1px solid rgba(84,156,255,.25);
  color: #a8d8ff;
  border-radius: 12px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  transition: .2s;
}

.card a:hover {
  background: rgba(84,156,255,.3);
  color: white;
}

.schedule-filter {
  color: white;
  font-weight: bold;
  margin-bottom: 20px;
  grid-column: 1 / -1;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 15px;
  backdrop-filter: blur(15px);
}

.schedule-filter select {
  background: #192344;
  color: white;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 12px;
  padding: 10px 14px;
  margin-left: 8px;
  font-size: 14px;
}

.schedule-filter select option {
  background: #192344;
  color: white;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 17px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  background: transparent;
  color: var(--text);
}

th, td {
  padding: 15px 12px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

th {
  color: #bcecff;
  background: rgba(75,111,190,.22);
  font-size: 12px;
  letter-spacing: .5px;
}

td {
  font-size: 14px;
}

td:nth-child(2) {
  text-align: left;
  color: white;
  font-weight: bold;
}

tbody tr {
  transition: .2s;
}

tbody tr:nth-child(even) {
  background: rgba(255,255,255,.025);
}

tbody tr:hover {
  background: rgba(103,232,249,.09);
}

.rank {
  color: var(--cyan);
  font-size: 17px;
  font-weight: bold;
}

.page {
  display: none;
}

.page.active {
  display: block;
  animation: pageFade .3s ease;
}

@keyframes pageFade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.league {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(170px,1fr));
  gap: 14px;
}

.team-card {
  padding: 22px 15px;
  background: var(--glass);
  color: white;
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.16);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  font-weight: bold;
  transition: .25s;
  cursor: pointer;
  text-align: center;
}

.team-card:nth-child(4n+1) {
  border-top: 3px solid #60a5fa;
}

.team-card:nth-child(4n+2) {
  border-top: 3px solid #a78bfa;
}

.team-card:nth-child(4n+3) {
  border-top: 3px solid #67e8f9;
}

.team-card:nth-child(4n) {
  border-top: 3px solid #818cf8;
}

.team-card:hover {
  transform: translateY(-5px);
  background: rgba(255,255,255,.13);
  border-color: rgba(103,232,249,.45);
  box-shadow: 0 15px 35px rgba(0,0,0,.25);
}

.team-card small {
  display: block;
  color: var(--muted);
  margin-top: 8px;
}

/* チームロゴ */
.team-logo {
  width: 34px;
  height: 34px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-logo-large {
  width: 100px;
  height: 100px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-name-button {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 0;
  background: transparent;
  color: white;
  font-weight: 900;
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
  text-align: left;
}

.team-name-button:hover {
  color: var(--cyan);
  text-decoration: underline;
}

.team-card .team-logo {
  width: 65px;
  height: 65px;
  display: block;
  margin: 0 auto 12px;
}

/* チーム詳細ページ */
.back-button {
  border: 1px solid var(--glass-border);
  border-radius: 25px;
  background: rgba(255,255,255,.09);
  color: white;
  padding: 10px 18px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 25px;
  transition: .2s;
}

.back-button:hover {
  background: linear-gradient(135deg, #438cf5, #9275f5);
}

.team-detail-header {
  display: flex;
  align-items: center;
  gap: 22px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 12px 35px rgba(0,0,0,.18);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.team-detail-header h1 {
  margin: 0 0 8px;
}

.team-detail-header p {
  color: var(--muted);
  margin: 0;
}

.detail-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
  gap: 12px;
  margin: 20px 0 30px;
}

.stat-box {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 17px 10px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,.15);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  min-width: 0;
}

.stat-box small {
  display: block;
  color: var(--muted);
  font-weight: bold;
  margin-bottom: 8px;
}

.stat-box strong {
  color: var(--cyan);
  font-size: 22px;
  overflow-wrap: anywhere;
  text-shadow: 0 0 15px rgba(103,232,249,.25);
}

.detail-games {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 15px;
}

.empty-message {
  color: var(--muted);
  background: var(--glass);
  border: 1px dashed rgba(255,255,255,.25);
  border-radius: 16px;
  padding: 22px;
  text-align: center;
  grid-column: 1 / -1;
  backdrop-filter: blur(15px);
}

footer {
  text-align: center;
  color: var(--muted);
  background: rgba(12,18,40,.65);
  border-top: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 35px;
  font-size: 12px;
}

@media(max-width:600px) {
  header {
    min-height: 72px;
    padding: 0 4%;
    gap: 8px;
  }

  .logo {
    font-size: 15px;
  }

  .season {
    font-size: 11px;
    padding: 7px 9px;
  }

  nav {
    padding: 13px 4%;
  }

  main {
    padding: 27px 4%;
  }

  h1 {
    font-size: 24px;
  }

  th, td {
    padding: 12px 6px;
    font-size: 12px;
  }

  .schedule-filter select {
    display: block;
    margin: 10px 0;
    width: 100%;
  }

  .team-detail-header {
    padding: 18px;
    gap: 15px;
  }

  .team-logo-large {
    width: 75px;
    height: 75px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

/* HTML表示用の文字変換 */
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

/* チームロゴ */
function teamLogoHtml(teamName, large = false) {
  const info = teamInfo[teamName];
  const logoClass = large ? "team-logo-large" : "team-logo";

  if (!info) {
    return `<span class="${logoClass}" aria-hidden="true"></span>`;
  }

  return `
    <img
      class="${logoClass}"
      src="${info.logo}"
      alt="${escapeHtml(teamName)}"
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;
}

/* チーム名から日程データ上の略称を取得 */
function getTeamAlias(teamName) {
  return teamInfo[teamName]?.alias || teamName;
}

/* 日程上のチーム名と正式名称を照合 */
function matchesTeam(scheduleName, officialName) {
  if (!scheduleName || !officialName) return false;

  const alias = getTeamAlias(officialName);
  return scheduleName === officialName || scheduleName === alias;
}

/* 日付・時間で試合を並び替える */
function sortGames(games) {
  return [...games].sort((a, b) => {
    const aKey = `${a.date || ""} ${gameTime(a) || "99:99"}`;
    const bKey = `${b.date || ""} ${gameTime(b) || "99:99"}`;
    return aKey.localeCompare(bKey);
  });
}

/* 画面切り替え */
function showPage(page, button) {
  const target = document.getElementById(page);
  if (!target) return;

  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  target.classList.add("active");

  if (page !== "teamDetail") {
    lastMainPage = page;
  }

  if (button) {
    document.querySelectorAll("nav button").forEach(b => {
      b.classList.remove("active");
    });
    button.classList.add("active");
  }
}

/* チーム詳細から元の画面に戻る */
function goBackToList() {
  const button = document.querySelector(
    `nav button[data-page="${lastMainPage}"]`
  );
  showPage(lastMainPage, button);
}

/* 試合終了判定 */
function isFinished(g) {
  const status = String(g.status || "").toUpperCase();
  return status.includes("FINAL") ||
    (
      g.homeScore !== null &&
      g.homeScore !== undefined &&
      g.awayScore !== null &&
      g.awayScore !== undefined &&
      g.homeScore !== "" &&
      g.awayScore !== ""
    );
}

/* 試合会場 */
function gameVenue(g) {
  return g.venue || g.info?.[4] || "";
}

/* 試合開始時間 */
function gameTime(g) {
  return g.time || g.info?.[5] || "";
}

/* 試合カード */
function gameCard(g) {
  const finished = isFinished(g);
  const score = finished
    ? `${g.homeScore ?? ""} - ${g.awayScore ?? ""}`
    : "VS";

  const detail = typeof g.detail === "string" ? g.detail : "";

  return `
    <div class="card">
      <div class="tag">B.PREMIER · 2026-27</div>
      <div class="match">
        <div class="team">${escapeHtml(g.home || "")}</div>
        <div class="score">${escapeHtml(score)}</div>
        <div class="team">${escapeHtml(g.away || "")}</div>
      </div>
      <div class="status">
        ${escapeHtml(g.date || "")}
        ${g.date ? " · " : ""}
        ${escapeHtml(gameVenue(g))}
        ${gameVenue(g) && gameTime(g) ? " · " : ""}
        ${escapeHtml(gameTime(g))}
        ${g.status ? " · " + escapeHtml(g.status) : ""}
      </div>
      ${detail ? `
        <a href="${escapeHtml(detail)}" target="_blank" rel="noopener noreferrer">
          公式試合詳細を見る
        </a>
      ` : ""}
    </div>`;
}

/* 日程・試合結果 */
function renderSchedule() {
  const games = Array.isArray(officialData.schedule)
    ? officialData.schedule
    : [];

  const sortedGames = sortGames(games);

  const today = new Date();
  const todayText =
    `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

  const finishedGames = sortedGames.filter(isFinished);
  const todayGames = sortedGames.filter(g => g.date === todayText);

  document.getElementById("homeGames").innerHTML =
    todayGames.map(gameCard).join("") ||
    '<p class="empty-message">本日の試合はありません</p>';

  document.getElementById("latestGames").innerHTML =
    [...finishedGames].reverse().slice(0, 5).map(gameCard).join("") ||
    '<p class="empty-message">試合結果はありません</p>';

  const dates = [...new Set(
    sortedGames.map(g => g.date).filter(Boolean)
  )];

  const dateOptions = dates.map(date =>
    `<option value="${escapeHtml(date)}">${escapeHtml(date)}</option>`
  ).join("");

  const scheduleArea = document.getElementById("scheduleGames");

  scheduleArea.innerHTML = `
    <div class="schedule-filter">
      <label for="scheduleDateFilter">開催日を選択：</label>
      <select id="scheduleDateFilter">
        <option value="all">すべての日程</option>
        ${dateOptions}
      </select>
    </div>
    <div id="filteredGames" class="cards"></div>
  `;

  const dateFilter = document.getElementById("scheduleDateFilter");
  const filteredArea = document.getElementById("filteredGames");

  function showGames(date) {
    const filtered = date === "all"
      ? sortedGames
      : sortedGames.filter(g => g.date === date);

    filteredArea.innerHTML =
      filtered.map(gameCard).join("") ||
      '<p class="empty-message">この日の試合はありません</p>';
  }

  dateFilter.addEventListener("change", () => {
    showGames(dateFilter.value);
  });

  showGames("all");
}

/* 順位表 */
function renderStandings() {
  const teams = officialData.standings?.[currentArea] || [];

  document.getElementById("ranking").innerHTML =
    teams.map(t => `
      <tr>
        <td class="rank">${escapeHtml(t.rank)}</td>
        <td>
          <button class="team-name-button"
            onclick="openTeamDetail('${encodeURIComponent(t.team || "")}')">
            ${teamLogoHtml(t.team)}
            <span>${escapeHtml(t.team)}</span>
          </button>
        </td>
        <td>${escapeHtml(t.wins)}</td>
        <td>${escapeHtml(t.losses)}</td>
        <td>${escapeHtml(t.winRate)}</td>
        <td>${escapeHtml(t.pointDifference)}</td>
      </tr>
    `).join("") ||
    "<tr><td colspan='6'>順位情報がありません</td></tr>";
}

/* チーム一覧 */
function renderTeams() {
  const east = officialData.standings?.["東地区"] || [];
  const west = officialData.standings?.["西地区"] || [];

  const teams = [
    ...east.map(t => ({ ...t, area: "東地区" })),
    ...west.map(t => ({ ...t, area: "西地区" }))
  ];

  document.getElementById("teamList").innerHTML =
    teams.map(t => `
      <div class="team-card"
        role="button"
        tabindex="0"
        onclick="openTeamDetail('${encodeURIComponent(t.team || "")}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTeamDetail('${encodeURIComponent(t.team || "")}')}">
        ${teamLogoHtml(t.team)}
        <div>${escapeHtml(t.team)}</div>
        <small>${escapeHtml(t.area)} ${escapeHtml(t.rank)}位</small>
      </div>
    `).join("") ||
    '<p class="empty-message">チーム情報がありません</p>';
}

/* チーム詳細ページ */
function openTeamDetail(encodedName) {
  const teamName = decodeURIComponent(encodedName);

  const east = officialData.standings?.["東地区"] || [];
  const west = officialData.standings?.["西地区"] || [];
  const allTeams = [...east, ...west];

  const team = allTeams.find(t => t.team === teamName);

  if (!team) {
    alert("チーム情報が見つかりませんでした。");
    return;
  }

  const area = east.some(t => t.team === teamName)
    ? "東地区"
    : "西地区";

  const games = sortGames((officialData.schedule || []).filter(g =>
    matchesTeam(g.home, teamName) ||
    matchesTeam(g.away, teamName)
  ));

  const gameHtml = games.map(gameCard).join("");

  document.getElementById("teamDetailContent").innerHTML = `
    <div class="team-detail-header">
      ${teamLogoHtml(teamName, true)}
      <div>
        <h1>${escapeHtml(teamName)}</h1>
        <p>${area} · ${escapeHtml(team.rank)}位</p>
      </div>
    </div>

    <h2 class="section-title">TEAM STATS</h2>

    <div class="detail-stats">
      <div class="stat-box">
        <small>順位</small>
        <strong>${escapeHtml(team.rank)}位</strong>
      </div>
      <div class="stat-box">
        <small>勝利</small>
        <strong>${escapeHtml(team.wins)}</strong>
      </div>
      <div class="stat-box">
        <small>敗戦</small>
        <strong>${escapeHtml(team.losses)}</strong>
      </div>
      <div class="stat-box">
        <small>勝率</small>
        <strong>${escapeHtml(team.winRate)}</strong>
      </div>
      <div class="stat-box">
        <small>得失点差</small>
        <strong>${escapeHtml(team.pointDifference)}</strong>
      </div>
      <div class="stat-box">
        <small>試合数</small>
        <strong>${escapeHtml(team.gamesPlayed)}</strong>
      </div>
    </div>

    <h2 class="section-title">GAME SCHEDULE / RESULT</h2>
    <p class="subtitle">${escapeHtml(teamName)} の試合一覧</p>

    <div class="detail-games">
      ${gameHtml || '<p class="empty-message">このチームの試合情報はありません。</p>'}
    </div>
  `;

  showPage("teamDetail");
}

/* 地区切り替え */
function selectArea(area, button) {
  currentArea = area;

  document.querySelectorAll("#areaTabs button")
    .forEach(b => b.classList.remove("active"));

  if (button) button.classList.add("active");
  renderStandings();
}

/* データ読み込み失敗時の表示 */
function showLoadError() {
  document.getElementById("homeGames").innerHTML =
    '<p class="empty-message">データを読み込めませんでした。</p>';

  document.getElementById("latestGames").innerHTML =
    '<p class="empty-message">データを読み込めませんでした。</p>';

  document.getElementById("scheduleGames").innerHTML =
    '<p class="empty-message">データを読み込めませんでした。</p>';

  document.getElementById("ranking").innerHTML =
    "<tr><td colspan='6'>データを読み込めませんでした。</td></tr>";

  document.getElementById("teamList").innerHTML =
    '<p class="empty-message">データを読み込めませんでした。</p>';
}

/* 公式データ読み込み */
async function loadOfficialData() {
  try {
    const response = await fetch("./data.json", { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`data.jsonの読み込みに失敗しました (${response.status})`);
    }

    officialData = await response.json();

    if (!officialData || typeof officialData !== "object") {
      throw new Error("data.jsonの形式が正しくありません");
    }

    renderSchedule();
    renderStandings();
    renderTeams();

    console.log("公式データの読み込みに成功しました");

  } catch (error) {
    console.error("データ読み込みエラー:", error);
    showLoadError();
  }
}

loadOfficialData();
</script>
